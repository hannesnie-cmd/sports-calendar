# TV rights map for the 2026/27 season (UK English, German, Dutch).
# US channels come from ESPN's live broadcast data, not from this file.
#
# Layout:  competitions → <ESPN league slug or nfl/cfb/mlb/f1> → <country> → block
# A block has `source` (one or more URLs), `checked` (date), and `rules`.
# Rules are tried top to bottom; the first rule whose `when` matches is used.
# A rule without `when` always matches, so put it last as the default.
# A rule may override the block's `source`, `checked` and `confidence`.
#
# `when` conditions (all must match; times and weekdays are local to the country):
#   weekdays: [mon, tue, wed, thu, fri, sat, sun]
#   times:    ["15:30", "18:30"]        exact kickoff times
#   after:    "19:00"                   kickoff at or after
#   stages:   [final, semifinals]       ESPN stage slugs
#   teams:    ["481"]                   either team (ESPN ids)
#   home_team / away_team: ["481"]
#   league_teams: ger.1                 a team from that league's current table plays
#   tags:     [primetime, postseason]   tags set by the rule filters
#   event_ids: ["401915411"]            pin one specific match
#
# confidence: high | medium | low. Low-confidence channels show as "DAZN?".

countries:
  UK: {label: EN, timezone: Europe/London}
  DE: {label: DE, timezone: Europe/Berlin}
  NL: {label: NL, timezone: Europe/Amsterdam}

competitions:

  ger.1:   # Bundesliga
    DE:
      source:
        - https://www.bundesliga.com/de/bundesliga/news/bundesliga-spiele-im-fernsehen-tv-sender-rtl-dazn-sky-prime-363
        - https://www.fussballdaten.de/news/bundesliga-uebertragung-2026-27-wer-zeigt-spiele-live-tv-stream/
      checked: 2026-09-26
      confidence: high
      note: Sat.1 (9 games) and RTL (up to 10 games) add selected free-TV matches.
      rules:
        - when: {weekdays: [fri]}
          channels: [Sky]
        - when: {weekdays: [sat], times: ["15:30"]}
          channels: [Sky, DAZN (Konferenz)]
        - when: {weekdays: [sat], times: ["18:30"]}
          channels: [Sky]
        - when: {weekdays: [sun]}
          channels: [DAZN]
        - when: {weekdays: [mon, tue, wed, thu]}
          channels: [Sky, DAZN (Konferenz)]
        - channels: [Sky]
          confidence: low
    UK:
      source:
        - https://matchcast.tv/guides/how-to-watch-bundesliga-2026-27-in-uk
        - https://www.bundesliga.com/en/bundesliga/news/bundesliga-international-unveils-multi-layered-strategy-in-uk-and-ireland-33589
      checked: 2026-09-26
      confidence: medium
      rules:
        - when: {weekdays: [fri]}
          channels: [BBC iPlayer]
        - when: {weekdays: [sat], times: ["17:30"]}
          channels: [Sky Sports]
        - when: {weekdays: [sun]}
          channels: [Prime Video (PPV)]
        - channels: [Sky Sports+]
          confidence: low
    NL:
      source:
        - https://www.ziggo.nl/entertainment/sport/voetbal/bundesliga
      checked: 2026-09-26
      confidence: medium
      note: DPG Media bought Viaplay NL; rights may move to Videoland once the takeover is approved.
      rules:
        - channels: [Viaplay]

